name: Bug report
description: Report a reproducible problem in Pomodoro Timer
title: "[Bug] "
body:
  - type: input
    id: environment
    attributes:
      label: Application and Windows versions
      placeholder: "0.6.0, Windows 11"
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Steps, expected behavior, and actual behavior
      description: Remove personal information from any logs or screenshots.
    validations:
      required: true
